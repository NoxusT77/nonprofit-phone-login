[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nonprofit-phone-login"
version = "0.1.0"
description = "SMS code login and role-based portal access for nonprofits"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/nonprofit_login"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
